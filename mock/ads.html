<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>연습용 광고센터 - 광고 목록</title>
<style>
 body{font-family:sans-serif;margin:24px} table{border-collapse:collapse} td,th{border:1px solid #ccc;padding:6px 10px}
 #editor{display:none;margin-top:16px;padding:12px;border:1px solid #888}
 #toast{display:none;color:green} #toast.show{display:block}
</style></head><body>
<h1>광고 목록 (연습용)</h1>
<table id="adList"><thead><tr><th>광고번호</th><th>상품</th><th>입찰가</th><th>일예산</th><th>상태</th><th></th></tr></thead><tbody></tbody></table>
<div id="editor">
  <b id="editTitle"></b><br>
  입찰가 <input id="bidInput"> 일예산 <input id="budgetInput">
  상태 <select id="statusSelect"><option>ON</option><option>OFF</option></select>
  <button id="saveBtn">저장</button>
</div>
<p id="toast">저장되었습니다.</p>
<script src="store.js"></script>
<script>
let editing = null;
function render() {
  const tb = document.querySelector("#adList tbody"); tb.innerHTML = "";
  for (const a of loadAds()) {
    const tr = document.createElement("tr"); tr.dataset.adId = a.id;
    tr.innerHTML = `<td>${a.id}</td><td>${a.name}</td><td class="bid">${a.bid.toLocaleString()}원</td>
      <td class="budget">${a.budget.toLocaleString()}원</td><td class="status">${a.status}</td>
      <td><button class="edit">수정</button></td>`;
    tr.querySelector(".edit").onclick = () => openEditor(a.id);
    tb.appendChild(tr);
  }
}
function openEditor(id) {
  const a = loadAds().find(x => x.id === id); editing = id;
  document.getElementById("toast").className = "";
  document.getElementById("editTitle").textContent = `${a.id} ${a.name} 수정`;
  bidInput.value = a.bid; budgetInput.value = a.budget; statusSelect.value = a.status;
  editor.style.display = "block";
}
saveBtn.onclick = () => {
  const ads = loadAds(); const a = ads.find(x => x.id === editing);
  a.bid = parseInt(bidInput.value, 10); a.budget = parseInt(budgetInput.value, 10); a.status = statusSelect.value;
  saveAds(ads); editor.style.display = "none"; render();
  setTimeout(() => document.getElementById("toast").className = "show", 300); // 서버 응답 지연 흉내
};
render();
</script></body></html>
