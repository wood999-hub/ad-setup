<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>G마켓광고센터 - 광고 그룹 수정 (연습용)</title>
<style>
 body{font-family:sans-serif;margin:24px} td,th{border:1px solid #ccc;padding:6px 10px} table{border-collapse:collapse}
 .box__layer-wrap{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}
 .box__layer{background:#fff;padding:16px} [hidden]{display:none!important}
 #toast{color:green}
</style></head><body>
<main class="main">
  <h1>광고 그룹 수정 (연습용)</h1>
  <p>그룹명 <input id="groupName"> 일예산 <input id="budget"></p>
  <div class="box__col box__gap--16"><div class="box__table-wrap"><div class="box__table">
    <table class="table"><thead><tr><th>전체 선택</th><th>상품번호</th><th>상품명</th><th>키워드 수</th><th>키워드별</th></tr></thead>
    <tbody id="products"></tbody></table>
  </div></div></div>
  <div class="box__button-wrap"><button class="button button--xlarge">취소</button><button class="button button--blue" id="saveBtn">수정하기</button></div>
  <p id="toast" hidden>수정되었습니다.</p>
</main>
<div id="layer" hidden><div class="box__layer-wrap"><div class="box__layer">
  <div class="box__select-list"><div class="box__select-content"><div class="box__table">
    <table class="table"><thead><tr><th>키워드명</th><th>추천 입찰가</th><th>입찰가</th><th>삭제</th></tr></thead><tbody id="kws"></tbody></table>
  </div></div></div>
  <div class="box__button-wrap"><button class="button button--xxlarge" id="layerCancel">취소</button><button class="button button--blue" id="layerApply">적용하기</button></div>
</div></div></div>
<script src="store.js"></script>
<script>
const draft = loadGroup(); let current = null;
groupName.value = draft.name; budget.value = won(draft.budget);
function renderProducts() {
  products.innerHTML = "";
  draft.products.forEach((p, idx) => {
    const bids = p.keywords.map(k => k[2]);
    const tr = document.createElement("tr"); tr.className = "table-row";
    tr.innerHTML = `<td>선택</td><td>${p.no}</td><td>${p.name}</td><td>${p.keywords.length}건</td>
      <td class="table-data table-data--right"><div class="table-data__inner"><button class="button__text text__primary">${won(Math.min(...bids))}-${won(Math.max(...bids))}</button></div></td>`;
    tr.querySelector("button").onclick = () => openLayer(idx);
    products.appendChild(tr);
  });
}
function openLayer(idx) {
  current = idx;
  kws.innerHTML = draft.products[idx].keywords.map(([kw, rec, bid]) =>
    `<tr class="table-row"><td>${kw}</td><td><button class="button__text text__primary">${won(rec)}원</button></td>
     <td><input type="text" value="${won(bid)}"></td><td><button class="button button--tiny">삭제</button></td></tr>`).join("");
  layer.hidden = false;
}
layerCancel.onclick = () => { layer.hidden = true; };
layerApply.onclick = () => {
  [...kws.querySelectorAll("tr")].forEach((tr, i) => {
    draft.products[current].keywords[i][2] = parseInt(tr.querySelector("input").value.replace(/\D/g, ""), 10);
  });
  layer.hidden = true; renderProducts();
};
saveBtn.onclick = () => {
  if (!confirm("수정하시겠습니까?")) return;   // 브라우저 확인창
  setTimeout(() => { saveGroup(draft); toast.hidden = false; }, 300); // 서버 저장 흉내
};
renderProducts();
</script></body></html>
