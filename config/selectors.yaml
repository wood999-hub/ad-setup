# 실제 광고센터용 화면 주소/요소 위치.
# TODO 부분은 직접 채워야 한다 → README "3단계: 화면 요소 찾기" 참고
# (mock/selectors.yaml 이 완성된 예시)
urls:
  login: https://adcenter.esmplus.com/   # 새 G마켓 광고센터 (AI Product Ads)
  campaigns: https://adcenter.esmplus.com/ad/management   # 광고 관리(캠페인 목록) - 확인됨
  ad_list: TODO   # 키워드 목록 화면 주소 (캠페인 → 그룹 → 키워드)
  report: TODO    # 성과 리포트 화면 주소

# 광고 관리(캠페인 목록) - inspect 결과로 확인됨 (2026-10-11)
campaign_list:
  row: "div.box__result table.table tbody tr.table-row"
  id_attr: data-campaign-group-id      # 예) 110004379735
  name: "button.button__name"          # 캠페인명 (누르면 그룹 목록으로)
  toggle: "input.form__toggle"         # ON/OFF 스위치
  columns: [체크박스, ON/OFF, 캠페인명, 상태, 캠페인 유형, 노출수, 클릭수, 클릭률, 평균클릭비용,
            판매자 전환수, 전환율, 판매자 전환금액, 광고비용, 광고 수익율]
  download_report: "main.main > div.box__top-side > button.button"   # '운영현황 다운로드' (엑셀)
  period_tabs: "div.box__radio-tab > button.button__tab"            # 어제/오늘/1주일/이번달

# 파워클릭 일반그룹: 한 줄 = 키워드 1개 (입찰가가 키워드마다 있음)
ad_list:
  row: TODO       # 키워드 한 줄. 예) table#keywordList tbody tr
  id_attr: TODO   # 그 줄에서 키워드/광고 번호가 들어있는 속성. 예) data-keyword-no
  bid: TODO       # 줄 안에서 입찰가 칸. 예) td.bid
  budget:         # 줄마다 일예산 칸이 없으면 비워둔다 (일반그룹은 보통 그룹 단위 예산)
  status: TODO    # ON/OFF 칸. 없으면 비워둔다

edit:
  open: TODO          # 줄 안의 '수정' 버튼
  bid_input: TODO
  budget_input: TODO
  status_select: TODO
  save: TODO
  saved_signal: TODO  # 저장 성공 시 나타나는 요소(알림창 등)

report:
  row: TODO
  columns:            # 리포트 표에서 몇 번째 칸인지 (0부터 셈)
    ad_id: 0
    bid: 1
    impressions: 2
    clicks: 3
    cost: 4
    conversions: 5
    revenue: 6
