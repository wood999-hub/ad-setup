# 리포트 엑셀 머리글 → 프로그램 이름 연결.
# 지표 이름은 광고센터 리포트 '목록 노출 설정' 17개 항목으로 확인 (2026-10-11).
# 그룹명/상품번호/키워드 칸 이름은 키워드별 리포트를 실제로 받아 보고 확정할 것.
# 받는 법: 리포트 → 상세 리포트 → 리포트 유형 '키워드별', 보기 방식 '날짜별' → 검색 → 엑셀 다운로드
date: [기간, 날짜, 일자]
group: [광고 그룹명, 광고그룹명, 그룹명]
product_no: [상품 번호, 상품번호]
keyword: [키워드]
bid: [키워드 입찰가, 상품 입찰가, 입찰가]
budget: [일예산, 일 예산]
impressions: [노출 수, 노출수]
clicks: [클릭 수, 클릭수]
cost: [광고 비용, 광고비용]
conv_product: [광고 상품 전환 금액, 광고상품 전환금액]
conv_seller: [판매자 전환 금액, 판매자 전환금액]
